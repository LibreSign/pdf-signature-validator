deptrac:
  paths:
    - ./src

  layers:
    - name: Exception
      collectors:
        - type: directory
          value: src/Exception/.*

    - name: Model
      collectors:
        - type: directory
          value: src/Model/.*

    - name: Parser
      collectors:
        - type: directory
          value: src/Parser/.*

    # Pure PDF token decoding. No signature-policy dependencies.
    - name: PdfSyntax
      collectors:
        - type: directory
          value: src/Pdf/Syntax/.*

    # Historical PDF structures can read syntax, never DocMDP policy.
    - name: PdfRevision
      collectors:
        - type: directory
          value: src/Pdf/Revision/.*

    - name: DocMdpModel
      collectors:
        - type: directory
          value: src/Validation/DocMdp/Model/.*

    - name: DocMdpSyntax
      collectors:
        - type: directory
          value: src/Validation/DocMdp/Syntax/.*

    - name: DocMdpOwnership
      collectors:
        - type: directory
          value: src/Validation/DocMdp/Ownership/.*

    - name: DocMdpProjection
      collectors:
        - type: directory
          value: src/Validation/DocMdp/Projection/.*

    - name: DocMdpPolicy
      collectors:
        - type: directory
          value: src/Validation/DocMdp/Policy/.*

    # Entry points and revision orchestration; exclude all sublayers.
    - name: DocMdpValidation
      collectors:
        - type: directory
          value: src/Validation/DocMdp/[^/]+[.]php

  ruleset:
    Exception: ~
    Model: []
    Parser:
      - Exception
      - Model
      - PdfRevision
    PdfSyntax: []
    PdfRevision:
      - PdfSyntax
    DocMdpModel:
      - PdfRevision
      - PdfSyntax
    DocMdpSyntax: []
    DocMdpOwnership:
      - PdfSyntax
      - PdfRevision
    DocMdpProjection:
      - PdfRevision
      - DocMdpModel
    DocMdpPolicy:
      - DocMdpSyntax
      - DocMdpOwnership
      - Model
      - PdfSyntax
      - PdfRevision
      - DocMdpModel
    DocMdpValidation:
      - Model
      - Parser
      - DocMdpModel
      - PdfRevision
      - DocMdpPolicy
      - DocMdpProjection
